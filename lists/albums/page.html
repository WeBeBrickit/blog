<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favorite Albums | {{SITE}}</title>
<meta name="description" content="The records I'd save from a fire, ranked.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: black ground, a hero of glossy melted wax in primary colors with stark white type pushed through it,
   then a plain ranked column of square sleeves. Colour lives in the wax and the rank dots; everything else is black and white.
   Single deliberate dark look, so every color is set here. */
:root {
  --bg: #09080a;
  --panel: rgba(255, 255, 255, .035);
  --panel-hi: rgba(255, 255, 255, .07);
  --ink: #f6f2ea;
  --muted: #a29b90;
  --line: rgba(246, 242, 234, .12);
  --red: #e5322b;
  --orange: #f2871c;
  --yellow: #f5d23a;
  --green: #35ad5c;
  --blue: #2a78d6;
  --violet: #8a55d6;
  --focus: #f5d23a;
  --danger: #ff6b5e;
  --sleeve-bg: #151318;
  --font-display: "Archivo Black", "Arial Black", Impact, system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap {
  max-width: 700px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: flex; flex-direction: column; gap: 20px;
}

/* ---- Hero: wax blobs + white type ---- */
.hero { position: relative; padding-block: 34px 26px; isolation: isolate; }
.wax { position: absolute; inset: -10px -6px; z-index: -1; pointer-events: none; overflow: visible; }
.blob {
  position: absolute; display: block;
  border-radius: 58% 42% 51% 49% / 47% 58% 42% 53%;
  background:
    radial-gradient(circle at 32% 28%, rgba(255,255,255,.85) 0 4%, rgba(255,255,255,.25) 9%, transparent 16%),
    radial-gradient(circle at 70% 78%, rgba(0,0,0,.35), transparent 55%),
    var(--c);
  box-shadow: inset -6px -8px 14px rgba(0,0,0,.35), inset 4px 5px 10px rgba(255,255,255,.18), 0 6px 18px -8px rgba(0,0,0,.9);
}
.blob.drip::after {
  content: ""; position: absolute; left: 46%; top: 70%; width: 22%; height: 90%;
  border-radius: 0 0 50% 50% / 0 0 60% 60%;
  background: linear-gradient(90deg, rgba(0,0,0,.25), transparent 40%, rgba(255,255,255,.18) 55%, transparent 70%), var(--c);
}
.b1 { --c: var(--red);    width: 120px; height: 92px;  left: 2%;  top: 4%; }
.b2 { --c: var(--yellow); width: 74px;  height: 66px;  left: 31%; top: 0%;  border-radius: 46% 54% 60% 40% / 55% 45% 55% 45%; }
.b3 { --c: var(--green);  width: 96px;  height: 80px;  left: 58%; top: 10%; }
.b4 { --c: var(--blue);   width: 140px; height: 104px; right: 0;  top: 30%; border-radius: 40% 60% 45% 55% / 60% 40% 60% 40%; }
.b5 { --c: var(--orange); width: 88px;  height: 70px;  left: 14%; bottom: 6%; }
.b6 { --c: var(--violet); width: 54px;  height: 48px;  left: 46%; bottom: 0%; }
.b7 { --c: var(--red);    width: 40px;  height: 36px;  right: 22%; top: 2%; }
.b8 { --c: var(--yellow); width: 30px;  height: 26px;  left: 84%; bottom: 8%; }
.b9 { --c: var(--green);  width: 36px;  height: 30px;  left: 4%;  top: 62%; }
@media (prefers-reduced-motion: no-preference) {
  .blob { animation: melt 14s ease-in-out infinite alternate; }
  .b2, .b5, .b8 { animation-duration: 18s; animation-delay: -6s; }
  .b3, .b6, .b9 { animation-duration: 11s; animation-delay: -3s; }
  @keyframes melt {
    0%   { border-radius: 58% 42% 51% 49% / 47% 58% 42% 53%; }
    50%  { border-radius: 44% 56% 62% 38% / 56% 44% 56% 44%; }
    100% { border-radius: 52% 48% 40% 60% / 42% 60% 40% 58%; }
  }
}
.eyebrow { font: 500 11px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 {
  margin: 6px 0 10px; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(42px, 13vw, 92px); line-height: .86; letter-spacing: .02em; text-transform: uppercase;
  color: var(--ink); text-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 30px rgba(0,0,0,.55);
  display: flex; flex-direction: column;
}
h1 .l2 { align-self: flex-end; margin-right: 2%; }
h1 span span { display: inline-block; }
h1 .tilt-a { transform: translateY(4px) rotate(-3deg); }
h1 .tilt-b { transform: translateY(-3px) rotate(2deg); }
.sub { margin: 0; max-width: 46ch; color: var(--ink); opacity: .82; font-size: 14px; text-shadow: 0 1px 8px rgba(0,0,0,.8); }

.status { font: 400 12px var(--font-mono); color: var(--muted); min-height: 1.5em; }
.status.warn { color: var(--danger); }

/* ---- Add form ---- */
form.add {
  display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center;
  border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--panel);
}
@media (max-width: 520px) { form.add { grid-template-columns: 1fr auto; } form.add #artist { grid-column: 1 / -1; grid-row: 2; } }
input[type="text"], input[type="url"] {
  font: inherit; color: var(--ink); background: rgba(0,0,0,.5); border: 1px solid var(--line); border-radius: 4px;
  padding: 10px 12px; min-width: 0; width: 100%;
}
input::placeholder { color: rgba(246, 242, 234, .4); }
input[type="text"]:focus, input[type="url"]:focus { outline: none; border-color: var(--yellow); }
.btn {
  font: 600 13px var(--font-body); border: 0; border-radius: 4px; padding: 10px 18px; cursor: pointer;
  background: var(--ink); color: var(--bg);
}
#addBtn {
  background:
    radial-gradient(circle at 30% 28%, rgba(255,255,255,.75) 0 5%, transparent 14%),
    radial-gradient(circle at 70% 80%, rgba(0,0,0,.3), transparent 55%), var(--red);
  color: #fff; border-radius: 55% 45% 50% 50% / 50% 55% 45% 50%; padding: 12px 20px; text-shadow: 0 1px 2px rgba(0,0,0,.4);
  box-shadow: inset -3px -4px 8px rgba(0,0,0,.35), inset 2px 3px 6px rgba(255,255,255,.2);
}
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.btn.ghost:hover { color: var(--ink); }
.btn:focus-visible, .icon:focus-visible, .handle:focus-visible, .cover:focus-visible, a.title:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---- Ranked rows ---- */
ol.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
li.game {
  display: grid; grid-template-columns: 24px 34px 68px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 8px 8px 4px;
  user-select: none;
}
li.game:hover { background: var(--panel-hi); }
li.game.dragging { position: relative; z-index: 5; background: #1a181d; border-color: rgba(246,242,234,.35); box-shadow: 0 18px 30px -12px rgba(0,0,0,.9); cursor: grabbing; }
.sorting, .sorting * { cursor: grabbing !important; }
.handle {
  display: grid; place-items: center; width: 24px; height: 44px; border: 0; background: none; color: var(--muted);
  cursor: grab; border-radius: 4px; touch-action: none; padding: 0;
}
.handle svg { width: 14px; height: 20px; fill: currentColor; }
.rank {
  --c: var(--red);
  width: 34px; height: 30px; display: grid; place-items: center;
  font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.55);
  border-radius: 56% 44% 52% 48% / 48% 56% 44% 52%;
  background: radial-gradient(circle at 30% 28%, rgba(255,255,255,.7) 0 5%, transparent 15%), radial-gradient(circle at 70% 80%, rgba(0,0,0,.3), transparent 55%), var(--c);
  box-shadow: inset -2px -3px 6px rgba(0,0,0,.3);
}
li.game:nth-child(6n+2) .rank { --c: var(--orange); }
li.game:nth-child(6n+3) .rank { --c: var(--yellow); color: #2a2208; text-shadow: none; }
li.game:nth-child(6n+4) .rank { --c: var(--green); }
li.game:nth-child(6n+5) .rank { --c: var(--blue); }
li.game:nth-child(6n+6) .rank { --c: var(--violet); }

.cover {
  width: 68px; aspect-ratio: 1; max-width: 100%; border-radius: 2px; overflow: hidden; padding: 0; cursor: pointer;
  border: 1px dashed var(--line); background: var(--sleeve-bg); color: var(--muted);
  display: grid; place-items: center; font: 500 10px/1.2 var(--font-mono); text-align: center; position: relative;
}
.cover.has-art { border: 0; box-shadow: 0 4px 12px -4px rgba(0,0,0,.9); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover:hover, .cover.armed, .cover.dropping { border-color: var(--yellow); color: var(--yellow); }
.cover.armed::after, .cover.dropping::after { content: ""; position: absolute; inset: 0; border: 2px solid var(--yellow); }
.cover.busy { opacity: .5; cursor: progress; }
.cover svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; display: block; margin: 0 auto 2px; }

.info { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
a.title, span.title {
  font: 700 17px/1.25 var(--font-body); overflow-wrap: anywhere; color: var(--ink); text-decoration: none; width: fit-content;
}
a.title:hover { text-decoration: underline; text-decoration-color: var(--yellow); text-underline-offset: 3px; }
a.title .ext { display: inline-block; width: 11px; height: 11px; margin-left: 5px; vertical-align: 1px; stroke: var(--muted); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.meta { font: 400 12px var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.actions { display: flex; gap: 2px; }
.icon {
  width: 34px; height: 34px; display: grid; place-items: center; border: 0; background: none; color: var(--muted);
  border-radius: 4px; cursor: pointer; padding: 0;
}
.icon:hover { background: rgba(255,255,255,.08); color: var(--ink); }
.icon.del:hover { background: rgba(255,107,94,.15); color: var(--danger); }
.icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon:disabled { opacity: .3; cursor: default; background: none; }

form.edit {
  grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  border-top: 1px solid var(--line); padding: 10px 4px 2px 8px; user-select: text;
}
form.edit label { display: flex; flex-direction: column; gap: 3px; font: 500 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-width: 0; }
form.edit label.wide { grid-column: 1 / -1; }
form.edit input { padding: 8px 10px; font: 400 14px var(--font-body); text-transform: none; letter-spacing: 0; }
form.edit .row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
form.edit .row .spacer { flex: 1; }
.btn.small { padding: 8px 14px; font-size: 12px; }
.btn.danger-text { background: none; color: var(--danger); padding-inline: 6px; }

@media (max-width: 480px) {
  li.game { grid-template-columns: 20px 28px 56px minmax(0, 1fr) auto; gap: 8px; }
  .rank { width: 28px; height: 26px; font-size: 11px; }
  .cover { width: 56px; }
  .actions .up, .actions .down { display: none; }
  a.title, span.title { font-size: 15px; }
  form.edit { grid-template-columns: 1fr; }
}

.empty { border: 1px dashed var(--line); border-radius: 6px; padding: 32px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; font: 400 18px var(--font-display); text-transform: uppercase; letter-spacing: .04em; color: var(--ink); margin-bottom: 6px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.hint kbd { font: 400 11px var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--ink); }
.readonly .add, .readonly .actions, .readonly .handle, .readonly .hint { display: none; }
.readonly li.game { grid-template-columns: 34px 68px minmax(0, 1fr); padding-left: 10px; }
.readonly .cover { cursor: default; }
.readonly .cover:not(.has-art) { visibility: hidden; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 4px; padding: 10px 14px; display: flex; gap: 14px; align-items: center;
  font-size: 14px; max-width: calc(100% - 32px); z-index: 20;
}
.toast button { font: 600 13px var(--font-body); background: none; border: 0; color: var(--bg); cursor: pointer; text-decoration: underline; }
@media (prefers-reduced-motion: no-preference) {
  li.game { transition: background .15s; }
  .sorting li.game:not(.dragging) { transition: transform .18s ease, background .15s; }
}
[hidden] { display: none !important; }

/* ---- Site bar (webebrickit.com) ---- */
.sitebar { position: relative; z-index: 50; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  max-width: 680px; margin: 0 auto; padding: 12px max(16px, env(safe-area-inset-left, 0px)) 0;
  font: 600 13px/1.3 system-ui, "Segoe UI", sans-serif; }
.sitebar a, .sitebar span { color: #fff; text-decoration: none; background: rgba(0,0,0,.42); border-radius: 999px; padding: 6px 12px;
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.sitebar a:hover { background: rgba(0,0,0,.6); }
.sitebar span { font-weight: 500; opacity: .9; }
.cover img { background: var(--cover-bg, #111); }
</style>
</head>
<body>
<nav class="sitebar" aria-label="Site"><a href="/lists/">&larr; All lists</a><span>Updated {{SYNCED}}</span></nav>
<div class="wrap readonly" id="app">
  <header class="hero">
    <div class="wax" aria-hidden="true">
      <span class="blob b1 drip"></span><span class="blob b2"></span><span class="blob b3 drip"></span>
      <span class="blob b4 drip"></span><span class="blob b5"></span><span class="blob b6 drip"></span>
      <span class="blob b7"></span><span class="blob b8"></span><span class="blob b9"></span>
    </div>
    <span class="eyebrow">Personal ranking · LP</span>
    <h1><span class="l1">Fav<span class="tilt-a">o</span>rite</span><span class="l2">Alb<span class="tilt-b">u</span>ms</span></h1>
    <p class="sub">The records I'd save from a fire, #1 at the top. Click a title to open its Wikipedia page.</p>
  </header>

  <ol class="list" id="list">
<!--LIST-->
</ol>
</div>
</body>
</html>
